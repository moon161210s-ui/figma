<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>실시간 객실 청소 현황 | VENDY</title>
  <link rel="stylesheet" href="style.css" />
  <!-- 저장된 화면 모드를 화면이 그려지기 전에 적용해요 (깜빡임 방지) -->
  <script>try { if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) { }</script>
</head>

<body>

  <div class="app">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar">
      <!-- 로고: img/logo.svg (파일명이 다르면 여기만 바꾸세요) -->
      <a class="logo" href="#"><img src="resource/logo.svg" alt="VENDY" /></a>
      <button class="team-select" type="button">
        벤디호텔
        <img class="i24" src="resource/icon/arrow-down.svg" alt="이미지" />
      </button>

            <nav class="nav" aria-label="주 메뉴">
                <a class="nav-item is-active" href="#">
                    <img class="i20" src="resource/icon/soap.svg" alt="" />청소관리
                </a>
                <div class="nav-sub">
                    <a class="is-active" href="#" aria-current="page">실시간 객실 청소 현황</a>
                    <a href="#">청소 기준 설정</a>
                    <a href="#">청소 결과</a>
                </div>

                <a class="nav-item" href="#">
                    <img class="i20" src="resource/icon/calender.svg" alt="" />예약 현황
                </a>

                <a class="nav-item" href="#">
                    <img class="i20" src="resource/icon/users-profiles.svg" alt="" />직원관리
                </a>
                <div class="nav-sub">
                    <a href="#">직원 정보 설정</a>
                    <a href="#">직원 배정</a>
                </div>

                <a class="nav-item" href="#">
                    <img class="i20" src="resource/icon/message.svg" alt="" />업무 특이사항
                </a>
            </nav>

      <div class="sidebar-bottom">
        <a class="nav-item" href="#">
          <img class="i20" src="resource/icon/setting.svg" alt="이미지" />운영 시간대 설정
        </a>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <div class="main">

            <!-- Header (스크롤해도 상단에 고정) -->
            <div class="header-wrap">
                <header class="header">
                    <!-- 날짜·시간은 script.js 가 접속한 기기의 현재 시각으로 채워요 -->
                    <span class="header-date" id="headerDate">2026년 11월 5일 목요일 · 14:24</span>
                    <div class="header-actions">
                        <!-- 빨간 점(has-dot)은 확인하지 않은 알림이 있을 때만 script.js 가 붙여요 -->
                        <button class="icon-btn" id="bellBtn" type="button" aria-label="알림">
                            <img class="i20" src="resource/icon/bell.svg" alt="" />
                        </button>
                        <button class="icon-btn" id="themeBtn" type="button" aria-label="다크 모드로 변경"
                            aria-pressed="false">
                            <img class="i20" id="themeIcon" src="resource/icon/sun.svg" alt="" />
                        </button>
                    </div>
                    <span class="header-divider"></span>
                    <button class="profile" id="profileBtn" type="button" aria-haspopup="menu" aria-expanded="false"
                        aria-label="프로필 메뉴">
                        <!-- 프로필 사진: img/avatar.png -->
                        <img class="avatar" src="resource/img/avatar.png" alt="프로필" />
                        <img class="i16" src="resource/icon/arrow-down.svg" alt="" />
                    </button>
                </header>
            </div>

      <main>
        <div class="page-title">
          <h1>실시간 객실 청소 현황</h1>
          <p>객실을 선택하면 청소 일정과 담당 직원, 진행 상태를 확인할 수 있습니다.</p>
        </div>

        <!-- Summary -->
        <section class="summary">
          <div class="summary-card">
            <div class="summary-head">
              <span class="summary-icon"><img class="i20" src="resource/icon/door.svg" alt="이미지" /></span>
              오늘 입실 예정
            </div>
            <div class="summary-value" data-summary="checkin">12<small>실</small></div>
          </div>
          <div class="summary-card">
            <div class="summary-head">
              <span class="summary-icon"><img class="i20" src="resource/icon/door-open.svg" alt="이미지" /></span>
              오늘 퇴실 예정
            </div>
            <div class="summary-value" data-summary="checkout">15<small>실</small></div>
          </div>
          <div class="summary-card">
            <div class="summary-head">
              <span class="summary-icon"><img class="i20" src="resource/icon/soap.svg" alt="이미지" /></span>
              오늘 청소 대상
            </div>
            <div class="summary-value" data-summary="clean">17<small>실</small></div>
          </div>
          <div class="summary-card">
            <div class="summary-head">
              <span class="summary-icon"><img class="i20" src="resource/icon/exclamation-circle.svg" alt="이미지" /></span>
              확인 필요 사항
              <!-- 툴팁 문구는 아래 .tip-box 안에서 수정 / 아이콘은 기본 help-gray.svg, 호버 시 help-purple.svg -->
              <span class="tip" tabindex="0" aria-describedby="tip-check">
                <img class="i20 tip-icon" src="resource/icon/help-gray.svg" alt="도움말" />
                <img class="i20 tip-icon-hover" src="resource/icon/help-purple.svg" alt="이미지" aria-hidden="true" />
                <span class="tip-box" id="tip-check" role="tooltip">담당 직원의 재배정이나 청소 결과 검수 등<br>운영자의 확인 및
                  조치가 필요한 객실을 표시합니다.</span>
              </span>
            </div>
            <div class="summary-value is-alert" data-summary="alert">3<small>건</small></div>
          </div>
        </section>

        <!-- Workspace : 객실 목록 + 우측 상세 패널 -->
        <div class="workspace" id="workspace">

          <section class="panel">
            <div class="toolbar">
              <label class="search">
                <!-- 기본은 회색 돋보기, 입력창을 클릭(포커스)하면 검은색 돋보기로 바뀌어요 -->
                <img class="i20 search-icon" src="resource/icon/search-gray.svg" alt="이미지" />
                <img class="i20 search-icon-focus" src="resource/icon/search.svg" alt="이미지" aria-hidden="true" />
                <input id="roomSearch" type="text" placeholder="호실로 검색" />
              </label>
              <button class="select" type="button" data-filter="floor" aria-haspopup="listbox" aria-expanded="false">
                <span class="select-label">층별 필터</span>
                <img class="i24" src="resource/icon/arrow-down.svg" alt="이미지" />
              </button>
              <button class="select" type="button" data-filter="status" aria-haspopup="listbox" aria-expanded="false">
                <span class="select-label">청소 상태 필터</span>
                <img class="i24" src="resource/icon/arrow-down.svg" alt="이미지" />
              </button>
            </div>

            <!-- 층별 객실 타일은 script.js 의 ROOMS 데이터로 그려져요 -->
            <div id="floors"></div>
          </section>

          <div class="detail-cell">
            <aside class="detail" id="detail" aria-label="선택한 객실 상세"></aside>
          </div>

        </div>
      </main>

    </div>
  </div>

  <!-- 알림센터 (헤더 종 아이콘을 누르면 열려요 / 내용은 script.js 가 NOTIFICATIONS 로 그려요) -->
  <aside class="noti" id="notiPanel" role="dialog" aria-label="알림센터" hidden>
    <div class="noti-head">
      <h2 class="noti-title">알림센터</h2>
      <button class="noti-close" type="button" data-noti-close aria-label="알림센터 닫기">
        <img class="i16" src="resource/icon/close.svg" alt="이미지" />
      </button>
    </div>
    <div class="noti-tabs" id="notiTabs" role="tablist"></div>
    <div class="noti-list" id="notiList"></div>
    <div class="noti-dim" aria-hidden="true"></div>
  </aside>

  <script src="script.js"></script>
</body>

</html>
